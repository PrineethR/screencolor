<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Color Screen</title>
    <style>
        /* The Fix: position: fixed locks the body exactly to the visible screen edges */
        body {
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1c1c1e;
            transition: background-color 0.15s ease-in-out;
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: flex-end;   /* Pushes items to the bottom */
            touch-action: manipulation;
        }

        .controls {
            display: flex;
            gap: 30px;
            /* The Fix: env(safe-area-inset-bottom) pushes the buttons up if your phone has a swipe bar at the bottom */
            padding-bottom: calc(50px + env(safe-area-inset-bottom)); 
        }

        .dot {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }

        .dot.red { background-color: #ff3b30; }
        .dot.orange { background-color: #ff9500; }
        .dot.green { background-color: #34c759; }

        .dot:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="dot red" onclick="setColor('#ff3b30')"></button>
        <button class="dot orange" onclick="setColor('#ff9500')"></button>
        <button class="dot green" onclick="setColor('#34c759')"></button>
    </div>

    <script>
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`Wake Lock error: ${err.name}, ${err.message}`);
                }
            }
        }

        function setColor(color) {
            document.body.style.backgroundColor = color;
            
            if (!wakeLock) {
                requestWakeLock();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
