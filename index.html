<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Color Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1c1c1e;
            transition: background-color 0.25s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            touch-action: manipulation;
        }

        .controls {
            display: flex;
            gap: 25px; /* Slightly reduced gap to fit larger buttons */
            padding-bottom: calc(60px + env(safe-area-inset-bottom)); 
        }

        .dot {
            /* Increased size from 70px to 95px */
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }

        .dot.red { background-color: #ff3b30; }
        .dot.orange { background-color: #ff9500; }
        .dot.green { background-color: #34c759; }

        .dot:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="dot red" onclick="setColor('#ff3b30')"></button>
        <button class="dot orange" onclick="setColor('#ff9500')"></button>
        <button class="dot green" onclick="setColor('#34c759')"></button>
    </div>

    <script>
        let wakeLock = null;

        // Screen Wake Lock
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`Wake Lock error: ${err.name}, ${err.message}`);
                }
            }
        }

        // Change Color
        function setColor(color) {
            document.body.style.backgroundColor = color;
            if (!wakeLock) {
                requestWakeLock();
            }
        }

        // Re-enable Wake Lock on visibility change
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // Toggle Full-Screen Mode
        document.body.addEventListener('click', (e) => {
            // Ensure clicking the buttons doesn't trigger the background full-screen toggle
            if (e.target.tagName !== 'BUTTON') {
                if (!document.fullscreenElement) {
                    // Enter full screen
                    document.documentElement.requestFullscreen().catch((err) => {
                        console.log(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    // Exit full screen
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        });
    </script>
</body>
</html>
